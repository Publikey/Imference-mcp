# Publishes to npm when a version tag is pushed.
#
# Release procedure (the only supported way):
#   npm version patch|minor|major   # bumps package.json, commits, tags vX.Y.Z
#   git push --follow-tags
#
# Guard rails:
#   - the tag must match package.json exactly, or the run fails before publish;
#   - tests run in this workflow (and again via prepublishOnly) — no green, no publish;
#   - npm refuses to republish an existing version, so a re-pushed tag is a no-op error,
#     never a silent overwrite;
#   - the package is published with provenance: npm shows a verified link from the
#     package back to this exact commit and workflow run.
#
# The GitHub release also carries imference-mcp.js (the whole server in one
# file, esbuild, run with plain Node) and SHA256SUMS: Imference Desktop
# downloads it on demand ("Connect to Claude") and checks the hash.
#
# Auth is npm Trusted Publishing (OIDC) — no token, no secret. Configured on
# npmjs.com (package Settings → Trusted Publisher): repo Publikey/Imference-mcp,
# workflow release.yml, environment "npm". Requires npm >= 11.5, hence the
# npm upgrade step below.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance attestation

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Use 'npm version' to release." >&2
            exit 1
          fi

      - run: npm ci

      - run: npm test

      # The npm bundled with Node 22 (10.x) predates trusted publishing.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Build the single-file bundle
        run: |
          npm run bundle
          cd release
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | IMFERENCE_TOOLS_CATALOG=bundled node imference-mcp.js | grep -q "\"version\":\"${GITHUB_REF_NAME#v}\""
          sha256sum imference-mcp.js > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/imference-mcp.js release/SHA256SUMS
